name: nerok
description: "Nerok — a private, on-device migraine and headache tracker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Subscriptions
  purchases_flutter: ^9.6.0

  # Doctor report
  pdf: ^3.11.3
  printing: ^5.14.2

  # Charts
  fl_chart: ^1.1.1

  # Reminders
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1

  # Typography
  google_fonts: ^6.3.2

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2

  # Backup export / restore
  share_plus: ^12.0.0
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
